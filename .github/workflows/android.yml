name: Android beta

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - Android_beta
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Test, lint, and assemble non-debuggable beta APK
        shell: bash
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon testDebugUnitTest lintBeta assembleBeta

      - name: Prepare installable artifact
        if: success()
        shell: bash
        run: |
          mkdir -p android/artifacts
          cp android/app/build/outputs/apk/beta/app-beta.apk android/artifacts/Localis-Android-beta.apk
          cd android/artifacts
          sha256sum Localis-Android-beta.apk > SHA256SUMS.txt

      - name: Upload Android beta APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Localis-Android-beta-${{ github.sha }}
          path: android/artifacts/
          if-no-files-found: error
          retention-days: 14
