name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-verification:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      LOCALIS_COMMIT_SHA: ${{ github.sha }}
      LOCALIS_BUILD_CHANNEL: ci
      LOCALIS_RUN_AI_INTEGRATION: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expose bundled FFmpeg and ffprobe
        shell: pwsh
        run: |
          $ffmpeg = node -p "require('ffmpeg-static')"
          $ffprobe = node -p "require('ffprobe-static').path"
          if (!(Test-Path -LiteralPath $ffmpeg) -or !(Test-Path -LiteralPath $ffprobe)) {
            throw 'Bundled FFmpeg or ffprobe is missing after npm ci.'
          }
          "FFMPEG_PATH=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFPROBE_PATH=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALIS_OUTPUT_PROBE_PATH=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $ffmpeg) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Split-Path -Parent $ffprobe) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build production web application
        run: npm run build

      - name: Build desktop server bundle
        run: npm run build:desktop-server

      - name: Verify embedded build metadata
        run: npm run verify:build-metadata

      - name: Verify client and server build identity
        run: npm run verify:build-artifacts
